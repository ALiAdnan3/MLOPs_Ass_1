appId: ai.homeforge.desktop
productName: HomeForge AI
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
fileAssociations:
  - ext: homeforge
    name: HomeForge AI Project
    description: HomeForge AI house project
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: HomeForge-AI-Setup-${version}.${ext}
  shortcutName: HomeForge AI
